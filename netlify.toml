# Deploy do modo online (sala com codigo, mestre como servidor no navegador).
# O build LAN (npm run build / npm start) continua igual.
[build]
  base = "client"
  command = "npm run build:online"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: /sala/CODIGO, /player etc. caem no index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cabecalhos de seguranca. A CSP e a principal barreira contra XSS: mesmo que
# algum texto de jogador escape, o navegador so executa script do proprio site
# (e o player do YouTube). Se usar servidor PeerJS proprio (VITE_PEER_HOST),
# acrescente o host dele em connect-src.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
